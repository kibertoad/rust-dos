name: exp

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  t:
    name: ${{ matrix.v }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - v: base
          - v: lt
            debug: line-tables-only
          - v: o1lt
            debug: line-tables-only
            opt: "1"
          - v: nx-lt
            debug: line-tables-only
            nextest: true
          - v: nx-o1lt
            debug: line-tables-only
            opt: "1"
            nextest: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: exp-${{ matrix.v }}
      - if: matrix.nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: profile
        env:
          DEBUG: ${{ matrix.debug }}
          OPT: ${{ matrix.opt }}
        run: |
          if [ -n "$DEBUG" ]; then
            echo "" >> Cargo.toml
            echo "[profile.test]" >> Cargo.toml
            echo "debug = \"$DEBUG\"" >> Cargo.toml
            if [ -n "$OPT" ]; then echo "opt-level = $OPT" >> Cargo.toml; fi
          fi
          tail -4 Cargo.toml
          nproc; lscpu | grep "Model name"
      - name: build
        run: cargo test --workspace --locked --no-run --verbose 2>&1 | grep -E "Running .*crate-name rust_dos .*src/lib.rs" | grep -oE "opt-level=[0-9]|debuginfo=[a-z0-9-]+" | sort | uniq -c; cargo test --workspace --locked --no-run
      - name: run (interpreter)
        if: ${{ !matrix.nextest }}
        run: cargo test --workspace --locked
      - name: run (dynamic)
        if: ${{ !matrix.nextest }}
        run: RUST_DOS_CORE=dynamic cargo test --locked
      - name: run (interpreter, nextest)
        if: matrix.nextest
        run: cargo nextest run --workspace --locked --no-fail-fast && cargo test --workspace --locked --doc
      - name: run (dynamic, nextest)
        if: matrix.nextest
        run: RUST_DOS_CORE=dynamic cargo nextest run --locked --no-fail-fast && RUST_DOS_CORE=dynamic cargo test --locked --doc
      - run: du -sh target/debug/deps target/debug
